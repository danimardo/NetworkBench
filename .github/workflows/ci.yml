name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verificación Canónica y Cobertura (Q2)
    runs-on: windows-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificación canónica frontend y linters
        run: pnpm verify

      - name: Tests de integración y unitarios backend Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Cobertura Frontend Vitest (Q2 Baseline)
        run: pnpm test:coverage
