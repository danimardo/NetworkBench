  - que: "Modificar .specify/memory/constitution.md"
    nota: "requiere autorizacion especifica. Hay observaciones pendientes: ratificacion, Q1-Q4, puerta G6"
  - que: "Crear .github/workflows/"
    nota: "descartado a proposito: el DoD de CI de la constitucion es hoy inejecutable"
  - que: "Modificar Design/** o Historias.md"
    nota: "entrega del disenador y requisitos de producto"
  - que: "Modificar ~/.codex/config.toml"
