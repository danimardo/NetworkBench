    motivo: "NO existen. La constitucion reconoce que pnpm check aun debe crearse"
    como_verificarlo_despues: "tras la primera implementacion que los introduzca"
  - que: "Recarga del hook en la sesión anfitriona ya abierta"
    motivo: "el arreglo se ensayó en sesiones CLI nuevas"
    estado_actual: NO VERIFICABLE
    como_verificarlo_despues: "abrir sesión nueva y revisar /hooks; repetir escritura negativa y lectura"
  - que: "Precedencia real de .codex/config.toml sobre ~/.codex/config.toml"
    motivo: "las sesiones de este diagnóstico mostraron approval: never pese al on-request del proyecto; no se auditó la jerarquía completa"
    estado_actual: INFERIDO
    como_verificarlo_despues: "auditar por separado las capas efectivas; no atribuir al approval_policy el bloqueo producido por PreToolUse"
  - que: "Declaración alternativa de hooks en TOML"
    motivo: "JSON ya funciona; no se cambió el formato de configuración"
    estado_actual: DOCUMENTADO
    como_verificarlo_despues: "solo si se necesita migrar; respaldar config.toml y ensayar carga y ejecución"
  - que: "Carga real de CLAUDE.md y de los stubs por Claude Code"
    motivo: "los ficheros se crearon en esta misma sesion; Claude Code requiere sesion nueva"
    como_verificarlo_despues: "sesion nueva en F:/Apps/NetBench; /memory debe listar CLAUDE.md; / debe listar las skills"
  - que: "Validacion visual, de interaccion y con lector de pantalla de Design/"
    motivo: "sin navegador conectado; ya pendiente desde la auditoria v3"
    estado_actual: NO_VERIFICABLE
  - que: "Matriz Windows 10 1809 / 22H2 / 11, DPI 100-150-200, monitor desconectado, GPU integrada"
    motivo: "una sola maquina disponible"
    estado_actual: NO_VERIFICABLE
  - que: "Hooks de Claude Code y .claude/rules/"
    motivo: "capacidades no verificadas; el diseno no depende de ellas"
    estado_actual: NO_VERIFICABLE

  - comando: "prueba real en Claude Code: intento de modificar el documento de requisitos (2026-09-21)"
    resultado: >-
      LA BARRERA FALLO y el fichero se modifico. Causa: las reglas deny usaban un prefijo
      de directorio actual que no es una forma reconocida, asi que el glob no coincidia
      con nada y fallaba en silencio. Corregido, y reforzado con un hook PreToolUse.
    estado: VERIFICADO
  - comando: "hook PreToolUse compartido, probado con 14 payloads"
    resultado: "8 deny y 6 allow; 14/14 correcto. Distingue escribir en una ruta protegida de mencionarla"
    estado: VERIFICADO
    evidencia_adicional: >-
      El hook bloqueo dos llamadas reales de la propia sesion, incluida una edicion de
      documentacion que fue un falso positivo por confundir una flecha de prosa con una
      redireccion. Corregido y reprobado.

  - comando: "prueba real en Codex, paso A (2026-09-21): 'ejecuta ls'"
    resultado: "funciono. Retirar sandbox_mode arreglo la ejecucion de comandos"
    estado: VERIFICADO
  - comando: "prueba real en Codex, paso B (2026-09-21): escribir en una ruta protegida"
    resultado: >-
      FALLO TOTAL DE LA CAPA DE CODEX. Codex leyo las reglas, invoco la skill de cierre y
      edito el fichero igualmente. El hook no se disparo, no pidio confianza para los
      hooks y approval_policy no provoco ninguna pregunta.
    estado: VERIFICADO
    consecuencia: >-
      La capa de Codex pasa de INFERIDA a NO FUNCIONAL. Dentro de una sesion de Codex no
      hay contencion; la barrera efectiva es el hook pre-commit de Git.
  - comando: "codex features list"
    resultado: "la caracteristica 'hooks' esta stable y activada; el fallo es de ubicacion del fichero"
    estado: VERIFICADO

