riesgos_abiertos:
  - id: R1
    descripcion: "La constitucion no ratificada es la norma de facto; Q1-Q4 pueden invalidar reglas escritas hoy"
  - id: R2
    descripcion: "Resuelto antes de esta tarea: carga de las 12 skills por Codex VERIFICADA; no se repitió"
  - id: R3
    descripcion: "Historias.md, .specify/ y .agents/ sin versionar: una perdida del working tree se lleva constitucion y requisitos"
    gravedad: alta
  - id: R4
    descripcion: "Secretos en texto plano en ~/.config/opencode/opencode.jsonc; recomendado rotarlos"
  - id: R5
    descripcion: "Toolchain local por debajo de la linea base (Node, pnpm, Rust); bloqueara en G5"
  - id: R6
    descripcion: >-
      verify.mjs sigue dependiendo de que alguien lo invoque, pero desde el 2026-09-21
      el hook pre-commit lo ejecuta en cada commit. Requiere 'git config core.hooksPath
      scripts/git-hooks' una vez por clon: si nadie lo hace, la barrera no existe.
    gravedad: media
  - id: R7
    descripcion: >-
      Mitigado para las operaciones ensayadas en Codex CLI 0.155.1: hook confiado,
      escritura bloqueada y lectura permitida. No equivale a una barrera exhaustiva
      de filesystem ni verifica recarga de sesiones existentes u otras modalidades.
    gravedad: alta
  - id: R7_historico
    descripcion: >-
      Configuracion global de Codex sin aprobacion ni sandbox. Se intento mitigar en capas
      (.codex/config.toml, hook PreToolUse y hook pre-commit de Git), pero las dos
      primeras estaban DOCUMENTADA e INFERIDA. Registro histórico anterior al diagnóstico
      actual: el hook se ha ejecutado y reparado; conserva el diseño de fallo en abierto.
    gravedad: media
  - id: R8
    descripcion: "Puerta G6 abierta: las secciones §§29-54 del antiguo Historias.md siguen sin localizar"
