# Capacidades de las herramientas de agentes, validadas para NetworkBench.
#
# Regla de uso de esta cache:
#   version actual == version validada  -> reutilizar; no repetir la auditoria
#   version actual != version validada  -> revisar SOLO la herramienta afectada
# La cache nunca sustituye una verificacion cuando hay evidencia de cambios.
# Procedimiento: .agents/skills/verificar-sistema-agentes/SKILL.md

fecha_validacion: "2026-09-21"

herramientas:

  claude_code:
    version_validada: "2.1.278"
    modalidades_conocidas: [CLI, IDE, escritorio, nube]
    modalidad_validada: CLI
    estado: VERIFICADO
    metodo_de_verificacion: >-
      claude --help y busqueda de cadenas en el binario instalado
      (C:/Users/danimardo/.local/bin/claude), mas observacion de la sesion en curso.
    capacidades_usadas:
      instrucciones:
        rutas: ["CLAUDE.md", ".claude/CLAUDE.md", "CLAUDE.md anidados", "CLAUDE.local.md"]
        carga: "CLAUDE.md raiz y .claude/CLAUDE.md siempre; anidados al trabajar bajo su directorio"
        estado: VERIFICADO
      importaciones:
        sintaxis: "@ruta/al/fichero.md"
        comportamiento: "inlinea el contenido — garantia DETERMINISTA"
        estado: VERIFICADO
        uso_en_este_repo: "CLAUDE.md importa AGENTS.md y las 8 reglas"
      skills:
        ruta: ".claude/skills/<nombre>/SKILL.md"
        frontmatter: "name, description"
        invocacion: "/<nombre> o lenguaje natural"
        estado: VERIFICADO
        evidencia_adicional: "2026-09-21: las 10 skills speckit-* aparecieron en el listado de skills de la sesion de Claude Code. Los stubs cargan."
        uso_en_este_repo: "10 stubs speckit-*. Las 2 skills propias se alcanzan por referencia desde AGENTS.md, no tienen stub"
      permisos:
        ruta: ".claude/settings.json (+ settings.local.json no versionado)"
        clave: "permissions.allow / ask / deny / defaultMode"
        estado: VERIFICADO
        uso_en_este_repo: "allowlist de solo lectura; ask en escrituras de Git; deny en rutas protegidas"
        sintaxis_de_rutas:
          forma_correcta: "Edit(ruta), Edit(**/ruta), Edit(//absoluta), Edit(~/ruta)"
          cobertura: "Edit(ruta) cubre Write, Edit y NotebookEdit"
          estado: VERIFICADO
          leccion_2026_09_21: >-
            Las reglas se escribieron con prefijo de directorio actual y NO bloquearon
            nada: esa forma no esta reconocida y el glob fallo EN SILENCIO. Claude Code
            pudo modificar el documento de requisitos. Corregido y reforzado con un hook,
            porque un glob mal escrito no avisa.
        deny_absoluto: >-
          Un deny no se puede levantar ni con autorizacion del propietario. Por eso las
          escrituras de Git estan en 'ask': la regla es 'requiere permiso explicito cada
          vez', no 'prohibido para siempre'.
      hooks:
        ruta: "settings.json del proyecto -> hooks.PreToolUse"
        eventos: [PreToolUse, PostToolUse, PermissionRequest, UserPromptSubmit, SessionStart, SessionEnd, Stop]
        esquema_de_salida: "hookSpecificOutput.{hookEventName, permissionDecision, permissionDecisionReason, updatedInput}"
        decisiones: [allow, deny, ask, defer]
        estado: VERIFICADO
        evidencia: >-
          2026-09-21: el hook bloqueo dos llamadas reales de la propia sesion. Se aplica
          EN CALIENTE, sin reiniciar. Matcher usado:
          Edit, Write, NotebookEdit, Bash y PowerShell.
      agents:
        ruta: ".claude/agents/"
        estado: VERIFICADO
        uso_en_este_repo: "NO USADO — sin consumidor que lo justifique"
      commands:
        ruta: ".claude/commands/"
        estado: VERIFICADO
        uso_en_este_repo: "NO USADO — las skills cubren el caso"
    capacidades_no_verificadas:
      - nombre: ".claude/rules/*.md"
        estado: INFERIDO
        nota: "la cadena aparece en el binario y se describe como fichero cargado; no se ha comprobado su carga ni si admite @import. NO USADO"
      - nombre: "@import dentro de SKILL.md o de reglas por directorio"
        estado: NO_VERIFICABLE
        nota: "no comprobado. NO USADO"
      - nombre: "@import dentro de SKILL.md o de .claude/rules/*.md"
        estado: NO_VERIFICABLE
        nota: "por eso los stubs instruyen leer el canonico en vez de importarlo"
    limitaciones:
      - "Cambios en settings.json, skills o ficheros importados requieren sesion nueva"
      - "No lee AGENTS.md de forma nativa: por eso CLAUDE.md lo importa"
      - "No lee .agents/skills/: por eso existen los stubs"
      - "No se ha verificado equivalencia entre CLI, IDE, escritorio y nube"

  codex_cli:
    version_validada: "0.155.1"
    modalidades_conocidas: [CLI, escritorio, app-server, cloud]
    modalidad_validada: CLI
    estado: VERIFICADO_PARCIAL
    metodo_de_verificacion: >-
      codex --help y busqueda de cadenas en el binario instalado
      (~/.codex/packages/standalone/current/bin/codex.exe). NO se ha ejecutado Codex.
    capacidades_usadas:
      instrucciones:
        rutas: ["AGENTS.md", "AGENTS.override.md"]
        carga: "nativa, sin adaptador"
        estado: VERIFICADO
        evidencia: "cadenas en el binario, y AGENTS.md presente en el volcado de 'codex debug prompt-input' del 2026-09-21"
        nota: "AGENTS.override.md no existe en este repo y no debe crearse sin motivo"
      skills:
        ruta_repo: ".agents/skills/<nombre>/SKILL.md"
        ruta_global: "CODEX_HOME/skills"
        estado: VERIFICADO
        verificado_2026_09_21: >-
          'codex debug prompt-input' muestra F:/Apps/NetBench/.agents/skills como raiz de
          skills y lista las 12 del repositorio, incluidas cierre-de-tarea y
          verificar-sistema-agentes. Codex carga las skills propias SIN stub, al contrario
          que Claude Code. AGENTS.md tambien aparece en el prompt.
        diagnostico_barato: "codex debug prompt-input — local, solo lectura, sin llamar a la API"
        estado_anterior: INFERIDO
        evidencia: >-
          cadena de error 'failed to stat repo skills root' junto a '.agents' y 'skills',
          y ruta de fuente 'ext\skills\src\host_prompt.rs' en el binario. Ademas, el
          instalador de SpecKit para la integracion codex las deposito exactamente ahi.
        pendiente: "confirmar abriendo una sesion de Codex y listando sus skills"
    capacidades_ausentes:
      - nombre: "mecanismo propio de rules"
        estado: NO_PRESENTE
        consecuencia: >-
          Las reglas de .agents/rules/ le llegan como referencia en prosa desde AGENTS.md.
          Garantia DEPENDIENTE DEL MODELO, no determinista. Por eso las reglas
          innegociables viven dentro de AGENTS.md.
      - nombre: "mecanismo propio de workflows"
        estado: NO_PRESENTE
      - nombre: "roles o subagentes declarativos"
        estado: NO_VERIFICABLE
        nota: "'codex agents' navega sesiones, no define roles"
    permisos:
      ruta_global: "~/.codex/config.toml — FUERA de este repositorio"
      estado_global: "approval_policy=never; sandbox_mode=danger-full-access; f:\apps\netbench trusted"
      mitigacion_en_el_repositorio: ".codex/config.toml — approval_policy=on-request. sandbox_mode NO se fija: ver sandbox_windows"
      estado: NO_ES_BARRERA
      hallazgo_2026_09_21: >-
        Los unicos valores son 'on-request' (decide el modelo) y 'never'. NO existe un
        valor que obligue a preguntar. Con on-request, Codex edito una ruta protegida sin
        pedir nada. Se mantiene por ser mejor que never, no porque contenga nada.
      evidencia_valores: "codex --help, -a/--ask-for-approval"
      evidencia: >-
        Cadena de precedencia en el binario 0.155.1, por mensajes propios:
        'Overridden by enterprise-managed config' > 'Overridden by user config' >
        'Overridden by project config' > 'Overridden by session flags'.
        La configuracion de proyecto pisa a la del usuario.
      pendiente: "abrir Codex en el repo y comprobar que pide aprobacion para escribir"
    sandbox_windows:
      estado: VERIFICADO
      confirmado_2026_09_21: "tras retirar sandbox_mode, 'ejecuta ls' volvio a funcionar en una sesion real"
      hallazgo: >-
        El sandbox de Windows exige un paso previo con elevacion:
        'codex sandbox setup --elevated --user <usuario> --codex-home <ruta>'.
        Ademas no admite command/exec/write, terminate, resize, streaming ni
        outputBytesCap personalizado.
      evidencia: "cadenas del binario 0.155.1 + prueba real del 2026-09-21"
      consecuencia: >-
        Fijar sandbox_mode="workspace-write" en .codex/config.toml dejo Codex sin poder
        ejecutar comandos ni leer ficheros en este repositorio. RETIRADO. No volver a
        fijarlo sin ejecutar antes ese setup y comprobar que Codex sigue funcionando.
    config_por_proyecto:
      rutas: [".codex/config.toml", ".codex/hooks", ".codex/agents"]
      estado: DOCUMENTADO
      evidencia: "cadenas '.codex/config.toml', '.codex/agents', '.codex/hooks' junto a 'git repo root' y 'project config file' en el binario"
      uso_en_este_repo: ".codex/config.toml y .codex/hooks/; .codex/agents NO USADO"
    hooks:
      ruta: ".codex/hooks/hooks.json"
      eventos_detectados: [PreToolUse, PermissionRequest, PostToolUse, PreCompact, PostCompact, SessionStart, SessionEnd, UserPromptSubmit, SubagentStart, SubagentStop, Stop, Interrupt]
      esquema_de_salida: "hookSpecificOutput.{hookEventName, permissionDecision, permissionDecisionReason, additionalContext}"
      estado: NO_FUNCIONAL
      hallazgo_2026_09_21: >-
        Probado en una sesion real: el hook NO se disparo y Codex no pidio confianza para
        los hooks del repositorio. La caracteristica 'hooks' esta stable y activada
        (codex features list), asi que el fallo es de UBICACION del fichero, no de que
        los hooks esten apagados. Se han dejado dos rutas candidatas: .codex/hooks.json y
        .codex/hooks/hooks.json. Ver .codex/hooks/README.md.
      no_intentado: >-
        Declarar el hook como tabla TOML dentro de .codex/config.toml, pese a que la
        estructura HookEventsToml lo sugiere: una clave inventada puede impedir que Codex
        lea toda su configuracion de proyecto, y ya hubo una averia asi con sandbox_mode.
      evidencia: "cadenas 'hooks/hooks.json', 'PreToolUseHookSpecificOutputWire', 'permissionDecision', 'HookTrustStatus', 'trusted_hash' en el binario"
      confianza: "Codex pide confirmar los hooks del repositorio la primera vez (HookTrustStatus). No usar --dangerously-bypass-hook-trust"
      uso_en_este_repo: "PreToolUse, apuntando al guard COMPARTIDO con Claude Code; FALLA EN ABIERTO a proposito"
      criterio: >-
        Herramientas de fichero: cualquier mencion de ruta protegida -> deny.
        Herramientas de shell: ruta protegida MAS indicio de escritura -> deny; una
        lectura como 'cat Historias.md' se permite. Probado con 12 casos el 2026-09-21.
      consecuencia: >-
        RIESGO NO MITIGADO DENTRO DE CODEX. A 2026-09-21 no hay contencion efectiva en
        sesion: ni hook, ni approval_policy, ni sandbox (exige setup con elevacion).
        La unica barrera real frente a Codex es scripts/git-hooks/pre-commit, en el
        momento del commit.

  opencode:
    version_instalada: "1.17.9"
    estado: NO_SOPORTADA
    motivo: "excluida por decision del propietario el 2026-09-21"
    nota_de_seguridad: >-
      Su configuracion global ~/.config/opencode/opencode.jsonc contiene secretos en texto
      plano (token Coolify, clave de API de Context7). Fuera del alcance de este repositorio.
      Recomendacion pendiente: rotarlos.

  gemini_cli:
    estado: NO_VERIFICABLE
    nota: "existe ~/.gemini pero el binario no esta en PATH"

asimetria_declarada: >-
  La importacion @path de Claude Code es determinista: inlinea el fichero, y lo que este
  en .agents/rules/ llega siempre. En Codex, la referencia desde AGENTS.md a un fichero de
  reglas es prosa y depende de que el modelo decida leerla. Consecuencia de diseno: las
  reglas innegociables estan DENTRO de AGENTS.md; .agents/rules/ guarda solo las de ambito
  acotado, que se consultan al tocar ese ambito.

guard_compartido:
  fichero: "scripts/agent/guard-protected-paths.mjs"
  consumidores: ["Claude Code, por su settings.json", "Codex, por su hooks.json"]
  motivo: >-
    Las dos herramientas usan el mismo esquema de salida, asi que un solo guard sirve para
    ambas. Vive en scripts/agent/ para que ninguna parezca su dueña y no haya dos copias
    que puedan divergir.
  criterio: >-
    Distingue escribir EN una ruta protegida de MENCIONARLA. En herramientas de fichero
    solo inspecciona los campos de ruta, no el contenido; si no hay campo de ruta
    reconocible (un parche que la lleva dentro), cae a todo el payload. En herramientas de
    shell solo inspecciona el comando, no la descripcion, y exige un indicio de escritura.
  probado: "14 casos el 2026-09-21: 8 deny y 6 allow, todos como se esperaba"

duplicacion_inevitable:
  que: "name y description de cada skill, repetidos en el frontmatter del stub de Claude Code"
  por_que: "el formato de Claude Code exige frontmatter propio"
  volumen: "2 lineas x 10 stubs speckit-*"
  control: "scripts/agent/check-adapters.mjs las compara contra el canonico"
  descartado: "enlaces simbolicos — no autorizados y fragiles en Windows"
