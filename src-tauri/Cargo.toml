[package]
name = "networkbench"
version = "0.1.0"
description = "NetworkBench desktop application using Microsoft NTTTCP"
authors = ["Daniel Diez Mardomingo"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.98.1"
# El crate produce dos binarios (la aplicación y el helper elevado). Sin esto, el
# empaquetador de Tauri no sabe cuál es el principal y aborta.
default-run = "NetworkBench"

[lib]
name = "networkbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "NetworkBench"
path = "src/main.rs"

[[bin]]
name = "networkbench-firewall-helper"
path = "helper/main.rs"

[dependencies]
tauri = { version = "2.11.6", features = [] }
tauri-plugin-updater = "2.12.0"
tokio = { version = "1.53.1", features = ["full"] }
rustls = "0.23.45"
tokio-rustls = "0.26.5"
rcgen = "0.14.10"
sha2 = "0.11.0"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Storage_FileSystem",
] }
webview2-com = "0.38.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
quick-xml = "0.42.0"
mdns-sd = "0.21.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
csv = "1.4.0"
unicode-normalization = "0.1.25"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
